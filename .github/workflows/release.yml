name: release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.github/**'
      - '.gitignore'
  workflow_dispatch:

# Read-only by default so that no job gets a token broader than it needs. Jobs
# that write must opt in explicitly.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: built-extension
          path: |
            dist/
            dist-chrome/
          retention-days: 90

  release-and-package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-created: ${{ steps.release.outputs.new_release_published }}
      version: ${{ steps.release.outputs.new_release_version }}
    steps:
      # This job holds contents:write, so every action is pinned to a full commit
      # SHA rather than a mutable major tag. Version comments track what each SHA is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-extension
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run Semantic Release
        id: release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package Extensions
        if: steps.release.outputs.new_release_published == 'true'
        run: |
          npx web-ext build --source-dir dist --artifacts-dir artifacts/firefox
          npx web-ext build --source-dir dist-chrome --artifacts-dir artifacts/chrome
          node ./scripts/rename-artifacts.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.release.outputs.new_release_published == 'true'
        with:
          name: packaged-firefox
          path: artifacts/firefox/
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.release.outputs.new_release_published == 'true'
        with:
          name: packaged-chrome
          path: artifacts/chrome/
          retention-days: 90

  publish-firefox:
    needs: release-and-package
    if: needs.release-and-package.outputs.release-created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # This job holds contents:write and the AMO signing secrets, so every action
      # is pinned to a full commit SHA rather than a mutable major tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packaged-firefox
          path: artifacts/firefox
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # Without this, npx below has no local node_modules to resolve web-ext from
      # and silently fetches an unpinned copy off the registry while the AMO
      # secrets are in scope.
      - run: npm ci
      - name: Extract ZIP for signing
        run: |
          mkdir -p dist-signing
          ZIP_FILE=$(find artifacts/firefox -name "*.zip" -print -quit)
          unzip -q "$ZIP_FILE" -d dist-signing
      - name: Sign Add-On via AMO
        run: npx --no web-ext sign --source-dir dist-signing --artifacts-dir artifacts/signed --channel listed
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_SECRET }}
      - name: Attach Signed XPI to GitHub Release
        run: gh release upload v${{ needs.release-and-package.outputs.version }} artifacts/signed/*.xpi --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-chrome:
    needs: release-and-package
    if: needs.release-and-package.outputs.release-created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: packaged-chrome
          path: artifacts/chrome
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # chrome-webstore-upload-cli is a devDependency pinned to an exact version so
      # that the store credentials below are never exposed to an unpinned registry
      # fetch. The bin it installs is named chrome-webstore-upload, without the -cli.
      - run: npm ci
      - name: Upload to Chrome Web Store
        # chrome-webstore-upload-cli v4 dropped the credential flags in favor of env vars
        # see: https://github.com/fregante/chrome-webstore-upload-cli/issues/80
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          ZIP_FILE=$(find artifacts/chrome -name "*.zip" -print -quit)
          npx --no chrome-webstore-upload upload --source "$ZIP_FILE"
